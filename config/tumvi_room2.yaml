---
cam0:
    camera_model: equi
    T_cam_imu:
        - [-0.9995378259923383, 0.02917807204183088, -0.008530798463872679, 0.047094247958417004]
        - [0.007526588843243184, -0.03435493139706542, -0.9993813532126198, -0.04788273017221637]
        - [-0.029453096117288798, -0.9989836729399656, 0.034119442089241274, -0.0697294754693238]
        - [0.0, 0.0, 0.0, 1.0]
    distortion_coeffs: [0.010171079892421483, -0.010816440029919381, 0.005942781769412756, -0.001662284667857643]
    intrinsics:
        - [380.81042871360756, 0.0, 510.29465304840727]
        - [0.0, 380.81194179427075, 514.3304630538506]
        - [0.0, 0.0, 1.0]

# 图像与特征跟踪
rows: 1024
cols: 1024
per_grid_rows: 70
per_grid_cols: 70
valid_mask_path: config/tumvi_room2_valid_mask.png
mask_radius: 36.0
min_feature_num: 100

flow_back: true
max_square_move_dist: 0.5
min_gradient: 10.01
enable_statistics: true

# 特征与关键帧管理
reproj_err_thres: 3.0
reproj_huber_thres: 1.0
min_landmark_observations: 3
min_depth: 0.1
max_depth: 10.0
parallax_threshold: 25.0
keyframe_min_connection_ratio: 0.75

# 滑窗优化
num_iterations: 6
max_solver_time: 0.02
max_frame_count: 9
visual_factor_weight: 10
num_threads: 1
trust_region_strategy: levenberg_marquardt

# 时间延迟可观测性
delay_obs_gyro_threshold: 0.3
delay_obs_speed_threshold: 5.0
delay_obs_min_frames: 3
# IMU 模型与积分
integrator_type: midpoint
acc_n: 0.0028
acc_w: 0.00086
gyr_n: 0.00016
gyr_w: 0.000022
g_norm: 9.81
acc_bias: [0.0, 0.0, 0.0]

# 视觉惯性初始化
init_gravity_tolerance: 0.21
init_min_scale: 0.01
sfm_min_points: 10
sfm_min_inliers: 8
sfm_epipolar_threshold: 0.008
sfm_pnp_threshold: 0.005
sfm_ba_iterations: 10

# 可视化
viewer:
    path_max_poses: 4000
