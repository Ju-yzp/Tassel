---
cam0:
    camera_model: equi
    T_cam_imu:
        - [0.9999998780127487, -0.00044857799178061507, -0.00020676622763048493, -0.030456063773219216]
        - [0.0004474483218398746, 0.9999851488767499, -0.005431557414178604, -0.005823770923739786]
        - [0.0002091996340368478, 0.005431464234396278, 0.99998522760678, -0.00898274879053545]
        - [0.0, 0.0, 0.0, 1.0]
    distortion_coeffs: [-0.02730666, -0.02021124, 0.01310008, -0.00477699]
    intrinsics:
        - [825.68121551, 0.0, 1007.41454464]
        - [0.0, 821.40256091, 641.90318803]
        - [0.0, 0.0, 1.0]

# 图像与特征跟踪
rows: 1200
cols: 2000
per_grid_rows: 120
per_grid_cols: 150
valid_mask_path: config/nori_valid_mask.png
mask_radius: 40.0
min_feature_num: 150

flow_back: true
max_square_move_dist: 0.4
min_gradient: 15.0
enable_statistics: true

# 特征与关键帧管理
reproj_err_thres: 3.0
reproj_huber_thres: 1.0
min_landmark_observations: 3
min_depth: 0.1
max_depth: 5.0
parallax_threshold: 25.0
keyframe_min_connection_ratio: 0.70

# 滑窗优化
num_iterations: 6
max_solver_time: 0.026
max_frame_count: 9
visual_factor_weight: 9.0
num_threads: 2

# 时间延迟可观测性
delay_obs_gyro_threshold: 0.1
delay_obs_speed_threshold: 2
delay_obs_min_frames: 3

# IMU 模型与积分
integrator_type: midpoint
acc_n: 0.03
acc_w: 0.0002
gyr_n: 0.001
gyr_w: 0.00002
g_norm: 9.80665
acc_bias: [0.0, 0.0, 0.0]
imu_repropagate_ba_threshold: 0.08
imu_repropagate_bg_threshold: 0.02

# 视觉惯性初始化
gravity_diff_threshold: 0.21
init_min_scale: 0.01
sfm_min_correspondences: 10
sfm_min_e_inliers: 8
sfm_e_ransac_threshold: 0.004
sfm_pnp_reproj_threshold: 0.008
sfm_max_bad_pnp_ratio: 0.3
sfm_ba_max_iterations: 10
sfm_ba_num_threads: 3

# 可视化
viewer:
    path_max_poses: 6000
